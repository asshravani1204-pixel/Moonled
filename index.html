<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Moonledger</title>
<meta name="theme-color" content="#482639">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Moonledger">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;1,300;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="theme.css">
</head>
<body>
<div id="bg" aria-hidden="true"></div>
<div id="stars" aria-hidden="true"></div>
<nav id="dots" aria-label="Chapters">
  <button data-t="c1" aria-label="The Moon"></button>
  <button data-t="c2" aria-label="The Offering"></button>
  <button data-t="c3" aria-label="The Ledger"></button>
  <button data-t="c4" aria-label="The Dawn"></button>
</nav>

<section class="ch" id="c1">
  <header>
    <h1>Moonledger</h1>
    <div class="hbtns">
      <button id="install" class="pill" hidden>Install</button>
      <button class="pill open-settings">Settings</button>
    </div>
  </header>
  <div class="mid">
    <p class="ey">I · The Moon</p>
    <div class="orb">
      <div class="halo"></div>
      <svg id="moon" viewBox="0 0 200 200" role="img" aria-label="Money left this month, shown as a glowing moon">
        <defs>
          <mask id="phase">
            <rect width="200" height="200" fill="#fff"/>
            <circle id="shade" cx="268" cy="100" r="84" fill="#000"/>
          </mask>
          <radialGradient id="lit" cx="40%" cy="38%" r="85%">
            <stop offset="0" stop-color="#EDEDFF"/>
            <stop offset=".55" stop-color="#9A9BE0"/>
            <stop offset="1" stop-color="#5A5B9F"/>
          </radialGradient>
        </defs>
        <circle cx="100" cy="100" r="84" fill="#5A5B9F" fill-opacity=".14"/>
        <g mask="url(#phase)">
          <circle cx="100" cy="100" r="84" fill="url(#lit)"/>
          <g fill="#5A5B9F" opacity=".28">
            <circle cx="76" cy="72" r="14"/><circle cx="122" cy="124" r="19"/><circle cx="64" cy="122" r="8"/><circle cx="128" cy="66" r="7"/><circle cx="98" cy="98" r="5"/>
          </g>
        </g>
        <circle cx="100" cy="100" r="84" fill="none" stroke="#9A9BE0" stroke-opacity=".5"/>
      </svg>
    </div>
    <p class="big" aria-live="polite"><span id="mn"></span><span id="mt"></span></p>
    <p id="moon-sub" class="muted"></p>
  </div>
  <p class="hint">scroll gently ↓</p>
</section>

<section class="ch" id="c2">
  <p class="ey rv">II · The Offering</p>
  <div class="card rv">
    <h2>What did the night take?</h2>
    <label class="amt"><span>₹</span><input id="amount" inputmode="decimal" placeholder="0" autocomplete="off" aria-label="Amount in rupees"></label>
    <div id="chips" class="chips" role="group" aria-label="Category"></div>
    <div class="row">
      <input type="date" id="date" aria-label="Date">
      <button id="add" class="primary">Offer</button>
    </div>
    <p id="msg" role="status"></p>
  </div>
</section>

<section class="ch" id="c3">
  <p class="ey rv">III · The Ledger</p>
  <div class="tabs rv" role="tablist" aria-label="Period">
    <button role="tab" aria-selected="true">Today</button>
    <button role="tab" aria-selected="false">This week</button>
    <button role="tab" aria-selected="false">This moon</button>
  </div>
  <div class="car rv" id="car"></div>
  <p class="muted small">swipe sideways ⟷</p>
</section>

<section class="ch" id="c4">
  <p class="ey rv">IV · The Dawn</p>
  <div class="card rv" aria-live="polite">
    <h2>What the dawn keeps</h2>
    <p class="big" id="sv"></p>
    <p class="muted" id="sv-sub"></p>
    <div class="bar" id="bar" hidden><i id="bar-i"></i></div>
    <p id="sv-pct"></p>
    <p class="muted" id="sv-note"></p>
  </div>
  <button class="pill open-settings rv">Tend the ledger</button>
</section>

<dialog id="settings">
  <h2>Tend the ledger</h2>
  <label>Monthly income (₹)<input type="number" id="income" min="0" step="any" inputmode="decimal"></label>
  <label>Monthly savings goal (₹)<input type="number" id="goal" min="0" step="any" inputmode="decimal"></label>
  <div class="dlg-actions">
    <button class="primary" id="save-settings">Save</button>
    <button class="pill" id="close-settings">Close</button>
  </div>
  <div class="dlg-actions">
    <button class="pill" id="export">Export backup</button>
    <button class="pill" id="import-btn">Import backup</button>
    <button class="pill" id="erase">Let it all fade</button>
  </div>
  <input type="file" id="import" accept="application/json" hidden>
</dialog>

<script src="app.js"></script>
<script src="bg.js"></script>
<script src="moon.js"></script>
</body>
</html>
